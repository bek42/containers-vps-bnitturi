services:
  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    volumes:
      - /home/bharani/container-data/infisical/redis:/data

  infisical:
    image: infisical/infisical:latest-postgres
    container_name: infisical
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_CONNECTION_URI
      - REDIS_URL
      - ENCRYPTION_KEY
      - AUTH_SECRET
      - SITE_URL
    depends_on:
      - infisical-redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
