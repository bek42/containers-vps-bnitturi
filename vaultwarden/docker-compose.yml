services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: always
    ports:
      - "127.0.0.1:8062:80"
    environment:
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      LOGIN_RATELIMIT_MAX_BURST: "10"
      LOGIN_RATELIMIT_SECONDS: "60"
      DOMAIN: ${VW_DOMAIN}
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
      SMTP_HOST: ${VW_SMTP_HOST}
      SMTP_PORT: ${VW_SMTP_PORT}
      SMTP_FROM: ${VW_EMAIL}
      SMTP_USERNAME: ${VW_EMAIL}
      SMTP_PASSWORD: ${VW_EMAIL_PASS}
      SMTP_AUTH_MECHANISM: Plain
      SMTP_TIMEOUT: "30"
    volumes:
      - /home/bharani/container-data/vaultwarden/vw-data/:/data/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/safe/bems2304/alive >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

  vw-backup:
    image: ttionya/vaultwarden-backup:1.27.0
    container_name: vw-backup
    restart: unless-stopped
    environment:
      DATA_DIR: /vaultwarden-data
      BACKUP_KEEP_DAYS: "30"
      RCLONE_REMOTE_NAME: OneDriveSync
      RCLONE_REMOTE_DIR: /VaultwardenBackup/
      CRON: "5 5 * * *"
      ZIP_ENABLE: "TRUE"
      ZIP_PASSWORD: ${VW_ZIP_PASS}
      ZIP_TYPE: zip
    volumes:
      - /home/bharani/container-data/vaultwarden/vw-data/:/vaultwarden-data
      - /home/bharani/container-data/vaultwarden/vw-data/rclone:/config/
