services:
  agentwatch:
    image: reg.greatsky.co.uk/agentwatch:sha-e98cb701
    container_name: agentwatch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"       # tunnel reaches it on localhost; nothing public
    volumes:
      # Episodes, played state and feed token. Writable: the /listen page can delete episodes and mark them played.
      - /home/bharani/container-data/agentwatch/podcast:/data
    user: "1001:1001"                # matches the owner (bharani) of ~/container-data/agentwatch/podcast
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
