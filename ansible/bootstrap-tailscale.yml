---
# Phase 1 – Install and connect Tailscale on the raw new box (root over public IP).
# Run before bootstrap.yml so that subsequent plays can use the Tailscale address.
#
# Required -e at runtime:
#   tailscale_authkey=tskey-auth-xxxxx   (ephemeral, one-time)
#
# After this play completes, note the Tailscale hostname/IP and fill in
# new_vps.ansible_host in inventory/hosts.yml before running the next phases.

- name: Bootstrap Tailscale on new_vps_raw
  hosts: new_vps_raw
  gather_facts: false
  become: true
  roles:
    - tailscale
