all:
  children:
    old_vps:
      hosts:
        old_vps:
          ansible_host: "FILL_IN_OLD_TAILNET_HOSTNAME"  # e.g. old-vps.tail1234.ts.net
          ansible_user: bharani
          ansible_port: 2281

    new_vps:
      hosts:
        new_vps:
          ansible_host: "FILL_IN_NEW_TAILNET_HOSTNAME"  # e.g. new-vps.tail1234.ts.net
          ansible_user: bharani
          ansible_port: 2281

    new_vps_raw:
      hosts:
        new_vps_raw:
          ansible_host: "FILL_IN_NEW_PUBLIC_IP"         # public IP, phases 1 & 2 (root)
          ansible_user: root
          ansible_port: 22
