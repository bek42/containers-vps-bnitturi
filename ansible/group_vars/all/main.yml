---
# Set to true during VPS migration to prevent accidental deploys before restore completes.
migration_freeze: true

# Canonical on-host paths (same layout on both old_vps and new_vps)
containers_dir:    /home/bharani/containers
container_data_dir: /home/bharani/container-data
dumps_dir:         /home/bharani/dumps

# Every entry that has a local database or blob data that must migrate.
# Fields added for migration:
#   compose_file  – absolute path to the stack's compose file on the host
#   env_file      – sops-encrypted env file (null if the stack has no secrets)
#   db_service    – compose service name for the database (null for blob stacks)
#   db_container  – container_name as declared in the compose file (null for blob stacks)
#   engine        – one of: postgres | mariadb | sqlite | blob
#                   sqlite / blob stacks get a cold copy via rsync (no dump)
#   db_root_pw_env – (mariadb only) name of the root-password env var *inside the container*
stateful_db_stacks:

  - name: nginx
    compose_file: /home/bharani/containers/nginx/docker-compose.yml
    env_file:     /home/bharani/containers/nginx/nginx.env
    db_service:   db
    db_container: mariadb           # container_name: mariadb in nginx/docker-compose.yml
    engine:       mariadb
    # jc21/mariadb-aria:10.11.5 still exposes MYSQL_ROOT_PASSWORD (MariaDB 10.x naming).
    # Official mariadb: images switched to MARIADB_ROOT_PASSWORD from 10.6+ — not this image.
    db_root_pw_env: MYSQL_ROOT_PASSWORD

  - name: gmailit
    compose_file: /home/bharani/containers/gmailit/simple-login-compose.yaml
    env_file:     /home/bharani/containers/gmailit/simplelogin.env
    db_service:   postgres
    db_container: sl-db             # container_name: sl-db in gmailit/simple-login-compose.yaml
    engine:       postgres

  # ── TODO: infisical ──────────────────────────────────────────────────────────
  # Postgres is EXTERNAL (Neon cloud DB via DB_CONNECTION_URI in infisical.env).
  # infisical/docker-compose.yml has NO local postgres container.
  # Only infisical-redis (container_name: infisical-redis) is local.
  #
  # Before adding infisical to this list:
  #   1. Confirm whether the Neon DB migrates independently (Neon project migration /
  #      branching) or requires a pg_dump of the Neon endpoint here.
  #   2. Decide whether Redis session/cache data must survive the cutover, or
  #      whether rsyncing container-data/infisical/redis is sufficient and users
  #      can simply re-authenticate on the new VPS.
  #   3. If Redis state must be preserved, add an entry with engine: blob and
  #      the verified container_name here.
  # ────────────────────────────────────────────────────────────────────────────

  - name: vaultwarden
    compose_file: /home/bharani/containers/vaultwarden/docker-compose.yml
    env_file:     /home/bharani/containers/vaultwarden/vaultwarden.env
    db_service:   ~        # blob stack: whole compose stops, SQLite files rsynced cold
    db_container: ~
    engine:       sqlite

  - name: registry
    compose_file: /home/bharani/containers/registry/docker-compose.yml
    env_file:     ~        # no secrets file; auth via NPM access lists
    db_service:   ~        # blob stack: whole compose stops, OCI layer files rsynced cold
    db_container: ~
    engine:       blob

# ── Bootstrap / deploy vars ───────────────────────────────────────────────────

vps_user: bharani
home_dir: "/home/{{ vps_user }}"

repo_url:    "git@github.com:bek42/containers-vps-bnitturi.git"
repo_branch: main

age_version:  "1.2.1"
sops_version: "3.13.1"

ssh_port:  2281
swap_file: /swapfile
swap_size: 2G

# Default to standard control-node paths; override with -e if your layout differs.
age_key_src:         "{{ lookup('env','HOME') }}/.config/age/keys.txt"
ssh_pubkey_path:     "{{ lookup('env','HOME') }}/.ssh/id_ed25519.pub"
old_box_pubkey_path: "{{ lookup('env','HOME') }}/.ssh/old_box.pub"

# Infisical connection vars (used by the repo role to fetch the GitHub deploy key).
# infisical_client_id, infisical_client_secret, and tailscale_authkey live in
# group_vars/all/secrets.sops.yaml (sops/age-encrypted, auto-loaded by community.sops).
infisical_domain:     CHANGEME   # e.g. https://infisical.<domain> — the OLD box, pre-cutover
infisical_project_id: CHANGEME
infisical_env:        prod

# nginx must be first (creates shared-proxy network); tunnel last (cloudflare credential is unique).
stack_order:
  - nginx
  - registry
  - infisical
  - vaultwarden
  - gmailit
  - portainer
  - tunnel
