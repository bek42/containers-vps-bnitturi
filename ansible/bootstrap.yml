---
# Phase 2 – Full host provisioning on new_vps_raw (root, before switching to bharani).
#
# Roles in order:
#   common   – apt packages + swap
#   user     – bharani user, sudo, authorized_keys, sshd hardening (port 2281)
#   docker   – docker-ce + compose plugin; add bharani to docker group
#   tooling  – pinned age + sops binaries
#   secrets  – age private key + sops symlink
#   repo     – git clone containers repo as bharani
#
# Required -e at runtime:
#   age_key_src=~/.config/age/keys.txt
#   ssh_pubkey_path=~/.ssh/id_ed25519.pub
#   old_box_pubkey_path=~/.ssh/old_box.pub
#
# After this play the SSH port changes to 2281 and root login is disabled.
# Verify port 2281 is reachable from a second terminal BEFORE the handler fires.

- name: Provision new_vps_raw
  hosts: new_vps_raw
  gather_facts: true     # docker role needs ansible_distribution_release
  become: true
  roles:
    - common
    - user
    - docker
    - tooling
    - secrets
    - repo
