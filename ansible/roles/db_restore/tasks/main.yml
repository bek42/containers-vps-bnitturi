---
# ── Postgres stacks ───────────────────────────────────────────────────────────

- name: Start postgres DB service
  ansible.builtin.shell:
    cmd: >-
      sops exec-env {{ item.env_file }} --
      docker compose -f {{ item.compose_file }} up -d {{ item.db_service }}
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list }}"
  loop_control:
    label: "{{ item.name }}"

# pg_isready exits 0 when the server is accepting connections.
- name: Wait for postgres to accept connections (pg_isready)
  ansible.builtin.command:
    cmd: docker exec {{ item.db_container }} pg_isready -U postgres
  register: pg_ready
  retries: 12
  delay: 5
  until: pg_ready.rc == 0
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list }}"
  loop_control:
    label: "{{ item.name }}"

# psql reads the SQL from stdin; Ansible never touches the credentials.
- name: Load postgres dump
  ansible.builtin.shell:
    cmd: >-
      docker exec -i {{ item.db_container }} psql -U postgres
      < {{ dumps_dir }}/{{ item.name }}.sql
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Bring up full postgres stack (make up is idempotent)
  ansible.builtin.command:
    cmd: make up
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list }}"
  loop_control:
    label: "{{ item.name }}"

# ── MariaDB stacks ────────────────────────────────────────────────────────────

- name: Start mariadb DB service
  ansible.builtin.shell:
    cmd: >-
      sops exec-env {{ item.env_file }} --
      docker compose -f {{ item.compose_file }} up -d {{ item.db_service }}
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb') | list }}"
  loop_control:
    label: "{{ item.name }}"

# $db_root_pw_env is expanded by the container's sh; mysqladmin works on MariaDB 10.x
# (mariadmin alias was only added in MariaDB 11.0.1).
- name: Wait for mariadb to be ready (mysqladmin ping)
  ansible.builtin.command:
    cmd: >-
      docker exec {{ item.db_container }}
      sh -c 'mysqladmin ping -uroot -p"${{ item.db_root_pw_env }}" --silent'
  register: mariadb_ready
  retries: 12
  delay: 5
  until: mariadb_ready.rc == 0
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb') | list }}"
  loop_control:
    label: "{{ item.name }}"

# mariadb client reads SQL from stdin; $db_root_pw_env expanded inside the container.
- name: Load mariadb dump
  ansible.builtin.shell:
    cmd: >-
      docker exec -i {{ item.db_container }}
      sh -c 'mariadb -uroot -p"${{ item.db_root_pw_env }}"'
      < {{ dumps_dir }}/{{ item.name }}.sql
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Bring up full mariadb stack (make up is idempotent)
  ansible.builtin.command:
    cmd: make up
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb') | list }}"
  loop_control:
    label: "{{ item.name }}"

# ── Blob stacks (sqlite / blob): data pre-populated by rsync, just start ─────

- name: Bring up blob stacks (data already in place from rsync)
  ansible.builtin.command:
    cmd: make up
    chdir: "{{ item.compose_file | dirname }}"
  loop: >-
    {{ (stateful_db_stacks | selectattr('engine', 'equalto', 'sqlite') | list)
     + (stateful_db_stacks | selectattr('engine', 'equalto', 'blob')   | list) }}
  loop_control:
    label: "{{ item.name }}"
