---
# ── Preparation ──────────────────────────────────────────────────────────────

- name: Create dumps directory
  ansible.builtin.file:
    path: "{{ dumps_dir }}"
    state: directory
    mode: '0750'

# ── Postgres + MariaDB: stop full stack, start only DB service, dump ─────────
# Stopping every service first ensures no app writes arrive after the dump starts.

- name: Stop full stack to halt writes – postgres/mariadb
  ansible.builtin.shell:
    cmd: >-
      sops exec-env {{ item.env_file }} --
      docker compose -f {{ item.compose_file }} stop
    chdir: "{{ item.compose_file | dirname }}"
  loop: >-
    {{ (stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list)
     + (stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb')  | list) }}
  loop_control:
    label: "{{ item.name }}"

- name: Start only DB service – postgres/mariadb
  ansible.builtin.shell:
    cmd: >-
      sops exec-env {{ item.env_file }} --
      docker compose -f {{ item.compose_file }} up -d {{ item.db_service }}
    chdir: "{{ item.compose_file | dirname }}"
  loop: >-
    {{ (stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list)
     + (stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb')  | list) }}
  loop_control:
    label: "{{ item.name }}"

- name: Dump postgres – pg_dumpall (all databases, consistent snapshot)
  ansible.builtin.shell:
    cmd: >-
      docker exec -t {{ item.db_container }} pg_dumpall -U postgres
      > {{ dumps_dir }}/{{ item.name }}.sql
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'postgres') | list }}"
  loop_control:
    label: "{{ item.name }}"

# Aria tables are non-transactional so --single-transaction is not safe; use --lock-tables.
# $db_root_pw_env is expanded by the *container's* sh, not the host shell.
- name: Dump mariadb – mariadb-dump --lock-tables (Aria is non-transactional)
  ansible.builtin.shell:
    cmd: >-
      docker exec -t {{ item.db_container }}
      sh -c 'mariadb-dump -uroot -p"${{ item.db_root_pw_env }}" --all-databases --lock-tables'
      > {{ dumps_dir }}/{{ item.name }}.sql
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'mariadb') | list }}"
  loop_control:
    label: "{{ item.name }}"

# ── Blob stacks (sqlite / blob): stop whole compose for quiescent cold copy ──
# No dump file is created; the data directories are transferred raw via rsync.

- name: Stop sqlite stacks (have an env_file) for quiescent cold copy
  ansible.builtin.shell:
    cmd: >-
      sops exec-env {{ item.env_file }} --
      docker compose -f {{ item.compose_file }} stop
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'sqlite') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop blob stacks (no env_file) for quiescent cold copy
  ansible.builtin.command:
    cmd: docker compose -f {{ item.compose_file }} stop
    chdir: "{{ item.compose_file | dirname }}"
  loop: "{{ stateful_db_stacks | selectattr('engine', 'equalto', 'blob') | list }}"
  loop_control:
    label: "{{ item.name }}"
