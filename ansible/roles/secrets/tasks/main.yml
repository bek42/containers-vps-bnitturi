---
- name: Ensure ~/.config/age directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/age"
    state: directory
    mode: '0700'
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"

# age_key_src is supplied with -e at runtime and never committed to git.
- name: Place age private key at ~/.config/age/keys.txt
  ansible.builtin.copy:
    src: "{{ age_key_src }}"
    dest: "{{ home_dir }}/.config/age/keys.txt"
    mode: '0600'
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"

- name: Ensure ~/.config/sops/age directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/sops/age"
    state: directory
    mode: '0700'
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"

# sops looks for keys in ~/.config/sops/age/keys.txt by default;
# symlink avoids keeping a second copy of the private key.
- name: Symlink ~/.config/sops/age/keys.txt → ~/.config/age/keys.txt
  ansible.builtin.file:
    src: "{{ home_dir }}/.config/age/keys.txt"
    dest: "{{ home_dir }}/.config/sops/age/keys.txt"
    state: link
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
