---
- name: Check if tailscaled is already installed
  ansible.builtin.stat:
    path: /usr/bin/tailscaled
  register: tailscaled_stat

- name: Install Tailscale via official script
  ansible.builtin.shell:
    cmd: curl -fsSL https://tailscale.com/install.sh | sh
    executable: /bin/bash
  when: not tailscaled_stat.stat.exists

- name: Ensure tailscaled is started and enabled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Connect to Tailscale network
  ansible.builtin.command:
    cmd: tailscale up --authkey={{ tailscale_authkey }}
