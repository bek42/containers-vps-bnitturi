---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - make
      - curl
      - ca-certificates
      - gnupg
      - rsync
    state: present

# ── Swap ──────────────────────────────────────────────────────────────────────

- name: Check if swap file exists
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_stat

- name: Allocate swap file (fallocate)
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_size }} {{ swap_file }}
  when: not swap_stat.stat.exists

- name: Lock down swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    mode: '0600'

- name: Format swap file (mkswap)
  ansible.builtin.command:
    cmd: mkswap {{ swap_file }}
  when: not swap_stat.stat.exists

- name: Activate swap (swapon)
  ansible.builtin.command:
    cmd: swapon {{ swap_file }}
  register: swapon_result
  # "Device or resource busy" means swap is already active — that's fine
  failed_when: swapon_result.rc != 0 and 'busy' not in swapon_result.stderr
  changed_when: swapon_result.rc == 0

- name: Persist swap in /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_file }} none swap sw 0 0"
    state: present
