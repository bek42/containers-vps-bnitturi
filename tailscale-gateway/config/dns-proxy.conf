# AdGuard dnsproxy configuration (YAML) for tailscale-gateway.
# The single upstream (the Cloudflare Gateway location DoH URL) is passed on the command line from tailscale-gateway.env (sops),
# because this repository is public and that URL identifies the Cloudflare location.
# Cloudflare Gateway is the only policy engine: there is no local blocklist, no hosts file and no fallback resolver.

# Bootstrap: used ONLY to resolve the DoH upstream's own hostname, never for client queries. Encrypted (DoT to IP literals),
# so it does not depend on Docker DNS, the host resolver, Tailscale or this proxy.
bootstrap:
  - "tls://1.1.1.1"
  - "tls://1.0.0.1"
fallback: []

listen-addrs: ["0.0.0.0"]          # inside the private gateway network only; no ports are published on the host
listen-ports: [53]

# Cache: short ceiling so Cloudflare policy changes take effect within 5 minutes. No optimistic (stale) answers.
cache: true
cache-size: 4194304
cache-min-ttl: 0
cache-max-ttl: 300
cache-optimistic: false

hosts-file-enabled: false
refuse-any: true
pending-requests-enabled: true
dnssec: false                       # validation is Cloudflare's job; local validation would turn block answers into failures
timeout: "5s"
ratelimit: 0                         # every client arrives from the gateway's own address, so per-IP limits would hit everyone
verbose: false                       # no query logging (Cloudflare Gateway keeps the policy log)
