version: 1
creds:
  - registry: registry:5000
    tls: disabled
    user: "{{env \"REGBOT_USER\"}}"
    pass: "{{env \"REGBOT_PASS\"}}"

defaults:
  interval: 168h

scripts:
  - name: cleanup old tags
    timeout: 60m
    script: |
      keep_count = 2
      protected = { ["latest"] = true, ["stable"] = true, ["main"] = true }
      platforms = { "linux/amd64", "linux/arm64", "linux/arm/v7" }

      function get_created(ref)
        local ok, ic = pcall(image.config, ref)
        if ok and ic and ic.Created then
          return ic.Created
        end
        for _, p in ipairs(platforms) do
          local mok, m = pcall(manifest.get, ref, p)
          if mok and m then
            local cok, c = pcall(function() return m:config() end)
            if cok and c and c.Created then
              return c.Created
            end
          end
        end
        return nil
      end

      repos = repo.ls("registry:5000")
      for _, r in ipairs(repos) do
        ref = reference.new("registry:5000/" .. r)
        tags = tag.ls(ref)

        with_dates = {}
        without_dates = {}
        for _, t in ipairs(tags) do
          if not protected[t] then
            ref:tag(t)
            local created = get_created(ref)
            if created then
              table.insert(with_dates, {tag = t, created = created})
            else
              table.insert(without_dates, t)
            end
          end
        end

        -- newest dates first
        table.sort(with_dates, function(a, b) return a.created > b.created end)
        -- alphabetical descending (so semver "0.16.0" sorts before "0.9.0" alphabetically — not perfect but ok)
        table.sort(without_dates, function(a, b) return a > b end)

        log("Repo " .. r .. ": " .. #tags .. " total tags, " .. #with_dates .. " with dates, " .. #without_dates .. " without dates")

        -- delete from with_dates first (date-based decision is more reliable),
        -- then from without_dates if we still need to delete more
        local total_candidates = #with_dates + #without_dates
        local to_delete = total_candidates - keep_count
        if to_delete <= 0 then
          goto continue
        end

        -- iterate combined list (dated first kept, then undated) from end
        local combined = {}
        for _, c in ipairs(with_dates) do
          table.insert(combined, {tag = c.tag, info = c.created})
        end
        for _, t in ipairs(without_dates) do
          table.insert(combined, {tag = t, info = "no-date"})
        end

        for i = keep_count + 1, #combined do
          ref:tag(combined[i].tag)
          tag.delete(ref)
          log("Deleted: " .. r .. ":" .. combined[i].tag .. " (" .. combined[i].info .. ")")
        end

        ::continue::
      end