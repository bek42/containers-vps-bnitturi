version: 1
creds:
  - registry: registry:5000
    tls: disabled
    user: "{{env \"REGBOT_USER\"}}"
    pass: "{{env \"REGBOT_PASS\"}}"

defaults:
  interval: 168h

scripts:
  - name: cleanup old tags
    timeout: 60m
    script: |
      keep_count = 2
      protected = { ["latest"] = true, ["stable"] = true, ["main"] = true }
      platforms = { "linux/amd64", "linux/arm64", "linux/arm/v7" }

      function get_created(ref)
        -- try without platform first (works for single-arch images)
        local ok, ic = pcall(image.config, ref)
        if ok and ic and ic.Created then
          return ic.Created
        end
        -- fall back to trying common platforms (for multi-arch manifest lists)
        for _, p in ipairs(platforms) do
          ok, ic = pcall(image.config, ref, p)
          if ok and ic and ic.Created then
            return ic.Created
          end
        end
        return nil
      end

      repos = repo.ls("registry:5000")
      for _, r in ipairs(repos) do
        ref = reference.new("registry:5000/" .. r)
        tags = tag.ls(ref)

        candidates = {}
        for _, t in ipairs(tags) do
          if not protected[t] then
            ref:tag(t)
            local created = get_created(ref)
            if created then
              table.insert(candidates, {tag = t, created = created})
            else
              log("WARN: could not read config for " .. r .. ":" .. t)
            end
          end
        end

        log("Repo " .. r .. ": " .. #tags .. " total tags, " .. #candidates .. " candidates for cleanup")

        table.sort(candidates, function(a, b) return a.created > b.created end)

        for i = keep_count + 1, #candidates do
          ref:tag(candidates[i].tag)
          tag.delete(ref)
          log("Deleted: " .. r .. ":" .. candidates[i].tag .. " (created " .. candidates[i].created .. ")")
        end
      end