version: 1
creds:
  - registry: registry:5000
    tls: disabled
    user: "{{env \"REGBOT_USER\"}}"
    pass: "{{env \"REGBOT_PASS\"}}"

defaults:
  interval: 168h

scripts:
  - name: cleanup old tags
    timeout: 60m
    script: |
      keep_count = 2
      protected = { ["latest"] = true, ["stable"] = true, ["main"] = true }

      repos = repo.ls("registry:5000")
      for _, r in ipairs(repos) do
        ref = reference.new("registry:5000/" .. r)
        tags = tag.ls(ref)

        candidates = {}
        for _, t in ipairs(tags) do
          if not protected[t] then
            ref:tag(t)
            ok, ic = pcall(image.config, ref)
            if ok and ic and ic.Created then
              table.insert(candidates, {tag = t, created = ic.Created})
            else
              log("WARN: could not read config for " .. r .. ":" .. t)
            end
          end
        end

        log("Repo " .. r .. ": " .. #tags .. " total tags, " .. #candidates .. " candidates for cleanup")

        -- newest first
        table.sort(candidates, function(a, b) return a.created > b.created end)

        for i = keep_count + 1, #candidates do
          ref:tag(candidates[i].tag)
          tag.delete(ref)
          log("Deleted: " .. r .. ":" .. candidates[i].tag .. " (created " .. candidates[i].created .. ")")
        end
      end